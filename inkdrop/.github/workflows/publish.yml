name: Publish to Inkdrop registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify credentials
        env:
          INKDROP_ACCESS_KEY_ID: ${{ secrets.INKDROP_ACCESS_KEY_ID }}
          INKDROP_SECRET_ACCESS_KEY: ${{ secrets.INKDROP_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$INKDROP_ACCESS_KEY_ID" ] || [ -z "$INKDROP_SECRET_ACCESS_KEY" ]; then
            echo "::error::Set INKDROP_ACCESS_KEY_ID and INKDROP_SECRET_ACCESS_KEY repository secrets before publishing."
            exit 1
          fi
      - name: Publish package
        env:
          INKDROP_ACCESS_KEY_ID: ${{ secrets.INKDROP_ACCESS_KEY_ID }}
          INKDROP_SECRET_ACCESS_KEY: ${{ secrets.INKDROP_SECRET_ACCESS_KEY }}
        run: npx --yes @inkdropapp/ipm-cli@1.0.6 publish
