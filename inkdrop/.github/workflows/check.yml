name: Check package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify publish workflow secret isolation
        run: python3 tests/publish_workflow_test.py
      - name: Install dependencies
        run: npm ci
      - name: Generate preview palette
        run: npx generate-palette
      - name: Validate package
        run: npm pack --dry-run
