name: check

on:
  push:
  pull_request:

jobs:
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generated files are up to date
        run: python3 scripts/build.py --check
      - name: Palette schema and generators
        run: python3 -m unittest tests/build_test.py
      - name: Mirror synchronization
        run: bash tests/sync_test.sh
      - name: VS Code release workflow
        run: python3 vscode/tests/publish_workflow_test.py
      - name: Inkdrop release workflow
        run: python3 inkdrop/tests/publish_workflow_test.py
      - name: JSON files are valid
        run: |
          python3 -m json.tool palette/palette.json > /dev/null
          python3 -m json.tool zed/themes/hadal.json > /dev/null
          python3 -m json.tool cmux/hadal.json > /dev/null
          python3 -m json.tool opencode/hadal.json > /dev/null
          python3 -m json.tool opencode/v1/hadal.json > /dev/null
          python3 -m json.tool vscode/themes/hadal-color-theme.json > /dev/null
          python3 -m json.tool vscode/package.json > /dev/null
